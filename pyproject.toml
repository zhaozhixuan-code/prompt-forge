[project]
name = "promptforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # FastAPI Web 框架，用于定义 HTTP API、依赖注入和请求响应处理。
    "fastapi>=0.136.1",
    # Pydantic Settings，用于从环境变量和配置文件加载应用配置。
    "pydantic-settings>=2.14.0",
    # PyMySQL，用于通过 SQLAlchemy 连接 MySQL 数据库。
    "pymysql>=1.1.3",
    # cryptography，用于支持 MySQL 8 常见认证方式下 PyMySQL 的加密握手。
    "cryptography>=46.0.3",
    # python-dotenv，用于本地开发时读取 .env 环境变量文件。
    "python-dotenv>=1.2.2",
    # Redis 客户端，用于 Session、缓存、限流等 Redis 访问。
    "redis>=7.4.0",
    # SQLAlchemy ORM，用于数据库模型定义、查询构造和事务管理。
    "sqlalchemy>=2.0.49",
    # Uvicorn ASGI 服务器，standard 额外依赖提供开发运行所需的高性能组件。
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
